<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRT AI Terminal — One Terminal. Every Market Edge.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="topbar">
    <div class="brand-wrap">
      <div class="logo">K</div>
      <div class="brand">
        <div class="brand-name">KRT <span>AI TERMINAL</span></div>
        <div class="brand-tag">ONE TERMINAL. EVERY MARKET EDGE. 🚀</div>
      </div>
    </div>

    <div class="ticker-strip" id="tickerStrip"><!-- mini index ticker (JS) --></div>

    <div class="conn">
      <span id="connDot" class="dot demo"></span>
      <span id="connText" class="mono">CONNECTING…</span>
    </div>
  </header>

  <!-- ======= MAIN ======= -->
  <main>

    <!-- index cards -->
    <section class="indices" id="indices">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </section>

    <!-- gainers / losers -->
    <section class="grid2">
      <div class="panel">
        <div class="panel-head"><span class="ico up-ico">▲</span><h2>Top Gainers</h2><span class="live-pill">LIVE</span></div>
        <div class="panel-body" id="gainers"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="ico down-ico">▼</span><h2>Top Losers</h2><span class="live-pill">LIVE</span></div>
        <div class="panel-body" id="losers"></div>
      </div>
    </section>

    <!-- volume / alerts -->
    <section class="grid2">
      <div class="panel">
        <div class="panel-head"><span class="ico gold-ico">≣</span><h2>Highest Volume</h2></div>
        <div class="panel-body" id="volume"></div>
      </div>
      <div class="panel glow">
        <div class="panel-head"><span class="ico gold-ico">🔔</span><h2>Smart Alerts</h2><span class="muted mini" id="alertCount"></span></div>
        <div class="panel-body" id="alerts"></div>
      </div>
    </section>

    <!-- market pulse -->
    <section class="panel">
      <div class="panel-head"><span class="ico gold-ico">◉</span><h2>Market Pulse</h2><span class="muted mini" id="pulseUpdated"></span></div>
      <div class="pulse" id="pulse"></div>
    </section>

  </main>

  <footer>
    Educational &amp; personal-use tool · Not investment advice ·
    SEBI RA registration required for public advisory services
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
